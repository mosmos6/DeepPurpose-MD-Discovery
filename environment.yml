name: deeppurpose-md-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python
  - numpy
  - openmm
  - openmmforcefields
  - openff-toolkit
  - mdtraj
  - scikit-learn
  - pdbfixer
  - rdkit
  - pip
  - pip:
      - meeko
      - vina
      - scipy
      - gemmi
      - biopython
      - pubchempy
      - transformers
      - torch
      - tqdm
      - matplotlib
      - pandas
      - pandas-flavor
      - subword-nmt
      - sentencepiece
      # ✅ DeepPurpose deps
      - torch
      - tqdm
      - requests
      - wget
      - lifelines
      - prettytable
      - tensorboard
      - ax-platform
